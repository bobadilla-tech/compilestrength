name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"
  # No `branches:` filter: stacked PRs (base != main) get the same CI.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "24"
  # Dummy values so `next build` can validate src/env.ts without real secrets.
  # Nothing in CI connects to a database.
  DATABASE_URL: "postgresql://build:build@localhost:5432/build"
  BETTER_AUTH_SECRET: "ci-build-secret-ci-build-secret-0000"
  BETTER_AUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
  LEMONSQUEEZY_STORE_ID: "0"

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'apps/engineers-landing/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome owns formatting + lint; errors fail the job, warnings do not.
      - name: Biome (format + lint)
        run: bunx biome check --diagnostic-level=error .

      - name: ESLint (Next.js rules)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bunx vitest run --coverage

      - uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            next-web-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}-

      - name: Next.js build
        run: bun run build

      # Proves the Cloudflare Workers bundle (what `deploy` ships) builds.
      - name: OpenNext (Cloudflare) build
        run: bunx opennextjs-cloudflare build

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 7

  landing:
    name: Engineers Landing
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/engineers-landing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Next.js build
        run: bun run build

      - name: OpenNext (Cloudflare) build
        run: bunx opennextjs-cloudflare build

  # Dependency vulnerabilities. Runs on every PR/push (not path-filtered):
  # advisories appear without any code change.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit web (high+)
        working-directory: apps/web
        run: bun install --frozen-lockfile && bun audit --audit-level=high

      - name: Audit landing (high+)
        working-directory: apps/engineers-landing
        run: bun install --frozen-lockfile && bun audit --audit-level=high

  # Single required check for the branch ruleset. Skipped jobs (path filter)
  # count as passing; failed/cancelled ones do not.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-changes, web, landing, audit]
    if: always()
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job finished with: $r"
              exit 1
            fi
          done
