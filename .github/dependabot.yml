version: 2
updates:
  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TS 7 yet; drop once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ":arrow_up:"
  - package-ecosystem: bun
    directory: /apps/engineers-landing
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ":arrow_up:"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ":arrow_up:"
